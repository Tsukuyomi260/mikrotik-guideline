<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mikro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Stylized MikroTik Router Chassis -->
  <rect x="12" y="32" width="40" height="18" rx="4" fill="#0f172a" stroke="url(#mikro-grad)" stroke-width="2.2" />
  
  <!-- RJ45 Port slots -->
  <rect x="16" y="37" width="5" height="5" rx="1" fill="#38bdf8" fill-opacity="0.8" />
  <rect x="23" y="37" width="5" height="5" rx="1" fill="#10b981" fill-opacity="0.8" />
  <rect x="30" y="37" width="5" height="5" rx="1" fill="#10b981" fill-opacity="0.8" />
  <rect x="37" y="37" width="5" height="5" rx="1" fill="#10b981" fill-opacity="0.8" />
  <rect x="44" y="37" width="5" height="5" rx="1" fill="#10b981" fill-opacity="0.8" />
  
  <!-- LED lights -->
  <circle cx="18.5" cy="46" r="1" fill="#38bdf8" />
  <circle cx="25.5" cy="46" r="1" fill="#10b981" />
  <circle cx="32.5" cy="46" r="1" fill="#10b981" />
  <circle cx="39.5" cy="46" r="1" fill="#10b981" />
  <circle cx="46.5" cy="46" r="1" fill="#10b981" />

  <!-- Radiating Wi-Fi waves on top -->
  <path d="M22 23 C27 18, 37 18, 42 23" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <path d="M26 27 C29 24, 35 24, 38 27" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="30" r="1.8" fill="#10b981" />
</svg>
